version: '3.8'

services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-prediction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      # Montage des logs (optionnel)
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - churn-network

  # Service optionnel : MLflow UI pour visualiser les expériences
  mlflow-ui:
    image: python:3.11-slim
    container_name: mlflow-ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    working_dir: /app
    command: >
      bash -c "
        pip install mlflow &&
        mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:///app/mlruns
      "
    depends_on:
      - churn-api
    networks:
      - churn-network
    profiles:
      - mlflow  # Utiliser avec: docker-compose --profile mlflow up

networks:
  churn-network:
    driver: bridge

volumes:
  mlruns-data:
    driver: local
